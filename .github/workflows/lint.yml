name: lint

on:
  push:
    branches: [main]
  pull_request:

jobs:
  awesome-lint:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 20
      - run: npx awesome-lint

  # Note: a generator-drift check would re-run python generate.py against a
  # clone of GetPageSpeed/nginx-extras and diff README.md. That repo is
  # currently private (source-of-truth lives on Bitbucket), so CI can't clone
  # it without a token. Local contributor discipline (`python generate.py`
  # before commit, enforced by CONTRIBUTING.md) is the gate today.

  link-check:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: lychee link check
        uses: lycheeverse/lychee-action@v2
        with:
          args: --no-progress --max-concurrency 4 --accept 200,206,429 README.md
          fail: true
